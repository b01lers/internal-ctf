version: '2.2'
services:
  rctf:
    image: redpwn/rctf:${RCTF_GIT_REF}
    restart: always
    labels:
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`rctf-internal.b01lers.net`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls={}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
    expose:
      - "80"
    networks:
      - rctf
      - traefuck
    env_file:
      - .env
    environment:
      - PORT=80
    volumes:
      - ./conf.d:/app/conf.d
    depends_on:
      - redis
      - postgres
  redis:
    image: redis:6.0.6
    restart: always
    command: ["redis-server", "--requirepass", "${RCTF_REDIS_PASSWORD}"]
    networks:
      - rctf
    volumes:
      - ./data/rctf-redis:/data
  postgres:
    image: postgres:12.3
    restart: always
    environment:
      - POSTGRES_PASSWORD=${RCTF_DATABASE_PASSWORD}
      - POSTGRES_USER=rctf
      - POSTGRES_DB=rctf
    networks:
      - rctf
    volumes:
      - ./data/rctf-postgres:/var/lib/postgresql/data

networks:
  rctf: {}
  traefuck:
    name: traefuck
    external: true
